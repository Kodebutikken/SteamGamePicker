spring.application.name=SteamGamePicker
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-flash-lite-latest
steam.api.key=${STEAM_API_KEY}
spring.cache.cache-names=appList,gameDetails,ownedGames
spring.cache.caffeine.spec=maximumSize=1000,expireAfterAccess=1h
spring.web.resources.static-locations=classpath:/static/,file:frontend/